# Every push and PR: Rust tests + clippy (warnings are errors) + frontend build,
# on the same Ubuntu 22.04 image the release tarball is built on. This is the
# Linux run that catches what a macOS dev box cannot (secret-service, PipeWire).
name: ci
on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: nothing in CI writes to the repo (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libssl-dev \
            libasound2-dev libsecret-1-dev build-essential curl wget file patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: Frontend typecheck + build
        run: pnpm build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Desktop entry + AppStream metadata are valid
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate packaging/miniti.desktop
          appstreamcli validate --no-net packaging/com.miniti.linux.metainfo.xml
      - name: CLI answers without a display
        run: |
          bin=src-tauri/target/debug/miniti
          cargo build --manifest-path src-tauri/Cargo.toml
          $bin --version
          $bin --help >/dev/null
          $bin completions bash | grep -q miniti
          # No app running: status must say so on exit 3 and Waybar output must still be valid JSON.
          code=0; $bin status || code=$?
          test "$code" -eq 3
          $bin status --waybar | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["class"] == "stopped"'

  # Launch the real binary under a virtual display and prove the webview paints:
  # a blank window (renderer, CSP, asset, or JS failure) fails this job and the
  # screenshot is attached as an artifact.
  smoke:
    runs-on: ubuntu-22.04
    needs: linux
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libssl-dev \
            libasound2-dev libsecret-1-dev build-essential curl wget file patchelf \
            xvfb dbus-x11 imagemagick x11-utils xdotool libgl1-mesa-dri libegl1 libgles2 mesa-utils
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: Build frontend + release binary
        run: pnpm build && cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Launch under Xvfb and screenshot
        env:
          RUST_LOG: info
        run: |
          export HOME=$RUNNER_TEMP/home; mkdir -p "$HOME"
          launch() { # $1 = variant name; remaining args = env assignments
            local name=$1; shift
            echo "=== variant: $name ($*)"
            env "$@" xvfb-run -a -s "-screen 0 1400x900x24" bash -c '
              dbus-run-session -- bash -c "
                glxinfo -B 2>/dev/null | grep -iE \"renderer|OpenGL version\" || true
                ./src-tauri/target/release/miniti > app-'"$name"'.log 2>&1 &
                APP=\$!
                sleep 12
                xwininfo -root -tree > windows-'"$name"'.txt
                import -window root screenshot-'"$name"'.png
                kill \$APP || true
                sleep 1
              "'
            echo "--- app-$name.log"; cat "app-$name.log" || true
            echo "unique colours: $(identify -format '%k' screenshot-$name.png)"
          }
          launch default WEBKIT_DISABLE_DMABUF_RENDERER=1
          launch nocompositing WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1
          launch software LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1
          UNIQUE=$(identify -format "%k" screenshot-default.png)
          grep -qi "panic" app-default.log && { echo "::error::panic in app log"; exit 1; }
          grep -qi miniti windows-default.txt || { echo "::error::no miniti window appeared"; exit 1; }
          grep -q "webview ready" app-default.log || echo "::warning::webview never reported ready in the default variant"
          [ "$UNIQUE" -ge 40 ] || { echo "::error::window looks blank ($UNIQUE colours)"; exit 1; }
      - name: Tarball from this build
        run: |
          packaging/gen-completions.sh src-tauri/target/release/miniti packaging/completions
          packaging/make-tarball.sh dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist-release/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: |
            screenshot-*.png
            app-*.log
            windows-*.txt

  # The pacman recipe must install what the tarball actually ships (issue #4):
  # build the package from this run's tarball in an Arch container, install
  # it, and let namcap look at it.
  package:
    runs-on: ubuntu-22.04
    needs: smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { name: tarball, path: dist-release }
      - name: makepkg in archlinux:base-devel
        run: |
          version="$(sed -n 's/^\s*"version"\s*:\s*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          docker run --rm -v "$PWD:/work" -w /work archlinux:base-devel bash -euxo pipefail -c "
            pacman -Syu --noconfirm namcap >/dev/null
            useradd -m build
            mkdir -p /tmp/pkg && cp packaging/omarchy-pkgs/miniti-bin/PKGBUILD /tmp/pkg/
            sed -i -e 's|^pkgver=.*|pkgver=$version|' \
                   -e \"s|^source_x86_64=.*|source_x86_64=(\\\"file:///work/dist-release/miniti-$version-x86_64-unknown-linux-gnu.tar.gz\\\")|\" \
                   -e \"s|^sha256sums_x86_64=.*|sha256sums_x86_64=('SKIP')|\" /tmp/pkg/PKGBUILD
            chown -R build /tmp/pkg
            # makepkg -s would need sudo for the build user; resolve the
            # dependency list as root instead (the real builder does the same).
            bash -c 'source /tmp/pkg/PKGBUILD; pacman -S --noconfirm --needed --asdeps \"\${depends[@]}\"' >/dev/null
            su build -c 'cd /tmp/pkg && makepkg --noconfirm'
            # The archlinux image skips man pages and docs on install (NoExtract
            # in its pacman.conf); a real system extracts them.
            sed -i '/^NoExtract/d' /etc/pacman.conf
            pacman -U --noconfirm /tmp/pkg/*.pkg.tar.zst
            pacman -Qlq miniti-bin
            test -x /usr/bin/miniti
            test -f /usr/share/applications/miniti.desktop
            test -f /usr/share/metainfo/com.miniti.linux.metainfo.xml
            test -f /usr/share/man/man1/miniti.1.gz   # makepkg zips man pages
            test -f /usr/share/icons/hicolor/scalable/apps/miniti.svg
            miniti --version
            namcap /tmp/pkg/*.pkg.tar.zst || true
          "
