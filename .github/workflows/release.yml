# Release build on the Ubuntu 22.04 baseline (glibc 2.35) so the tarball runs on
# Ubuntu 22.04+, Debian 12+ and rolling distros. Triggered by a v* tag.
# No repository secrets: managed mode enrolls at runtime (device-bound auth).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libssl-dev \
            libasound2-dev libsecret-1-dev build-essential curl wget file patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: Build binary
        run: pnpm build && cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Shell completions (the .deb picks them up from packaging/completions)
        run: packaging/gen-completions.sh src-tauri/target/release/miniti packaging/completions
      - name: Tarball
        run: packaging/make-tarball.sh dist-release
      # The tarball feeds the Omarchy package and every other install path, so
      # a bundler problem must not sink the release; a missing .deb shows up
      # as a warning on the run and in the asset list.
      - name: Bundle (.deb)
        id: deb
        continue-on-error: true
        run: pnpm tauri build
      - name: Warn if the .deb failed
        if: steps.deb.outcome == 'failure'
        run: echo "::warning::the .deb bundle failed; the release ships without it"
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp dist-release/*.tar.gz dist-release/*.sha256 out/
          cp src-tauri/target/release/bundle/deb/*.deb out/ || true
          ls -la out
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*
          generate_release_notes: true
