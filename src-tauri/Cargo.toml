[package]
name = "miniti"
version = "0.1.0"
description = "Miniti — native Linux desktop meeting assistant (Tauri 2 + Rust)"
authors = ["Miniti"]
edition = "2021"

[lib]
# `_lib` suffix keeps the lib name distinct from the `miniti` binary
# (required on Windows; harmless elsewhere).
name = "miniti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
