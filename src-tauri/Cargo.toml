[package]
name = "miniti"
version = "0.5.0"
description = "miniti — native Linux desktop meeting assistant (Tauri 2 + Rust)"
authors = ["miniti"]
edition = "2021"
rust-version = "1.85"

[lib]
# `_lib` suffix keeps the lib name distinct from the `miniti` binary
# (required on Windows; harmless elsewhere).
name = "miniti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production builds MUST enable this (the Tauri CLI does it for `tauri build`).
# Without it `tauri::generate_context!` treats the build as dev and points the
# window at the Vite dev server ("Could not connect to localhost").
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
cpal = "0.15"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = { version = "3", features = ["apple-native", "async-secret-service", "tokio", "crypto-rust"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
# Device-bound client authorization: P-256 installation key (ES256 proofs),
# SHA-256 for thumbprints/body hashes, base64url for JWS parts.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
# Desktop integration: `miniti` CLI (clap), control socket + D-Bus interface
# (zbus is already in the tree via the notification plugin), idle inhibit.
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
libc = "0.2"

# Linux-only: GTK hints for the floating surface (never take focus, stay
# above) and an optional wlr-layer-shell binding loaded at runtime with dlopen,
# so libgtk-layer-shell is not a hard dependency.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.8"
# Notifications with the `desktop-entry` hint (per-app attribution and
# muting in GNOME / KDE); the Tauri plugin sends summary + body only.
notify-rust = { version = "4", default-features = false, features = ["z"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Same code, quick turnaround: no LTO, many codegen units, incremental. For
# trying a checkout on a real machine (scripts/install-and-check.sh); every
# published binary uses `release`.
[profile.dogfood]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = false
